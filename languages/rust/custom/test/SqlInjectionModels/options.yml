qltest_cargo_check: true
qltest_dependencies:
  - diesel = { version = "2.2", features = ["sqlite"] }
  - postgres = { version = "0.19" }
  - sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
  - tokio = { version = "1.0", features = ["full"] }
  - warp = { version = "0.3" }
