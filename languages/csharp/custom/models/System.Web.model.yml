extensions:
  # `HttpResponse.StatusDescription` is echoed into the status line and into
  # error pages generated by IIS/ASP.NET without HTML encoding, so it is an
  # HTML injection sink (CWE-81, XSS in error message).
  - addsTo:
      pack: codeql/csharp-all
      extensible: sinkModel
    data:
      - [
          "System.Web",
          "HttpResponse",
          False,
          "set_StatusDescription",
          "(System.String)",
          "",
          "Argument[0]",
          "html-injection",
          "manual"
        ]
      - [
          "System.Web",
          "HttpResponseBase",
          True,
          "set_StatusDescription",
          "(System.String)",
          "",
          "Argument[0]",
          "html-injection",
          "manual"
        ]
