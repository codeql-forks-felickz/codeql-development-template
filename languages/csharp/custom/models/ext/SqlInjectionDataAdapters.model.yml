extensions:
  # `DataAdapter` constructors that take SQL command text as their first argument.
  # `codeql/csharp-all` models the `SqlDataAdapter` and `SQLiteDataAdapter` equivalents,
  # but not the OleDb, ODBC, or MySQL provider adapters.
  - addsTo:
      pack: codeql/csharp-all
      extensible: sinkModel
    data:
      - ["System.Data.OleDb", "OleDbDataAdapter", False, "OleDbDataAdapter", "(System.String,System.Data.OleDb.OleDbConnection)", "", "Argument[0]", "sql-injection", "manual"]
      - ["System.Data.OleDb", "OleDbDataAdapter", False, "OleDbDataAdapter", "(System.String,System.String)", "", "Argument[0]", "sql-injection", "manual"]
      - ["System.Data.Odbc", "OdbcDataAdapter", False, "OdbcDataAdapter", "(System.String,System.Data.Odbc.OdbcConnection)", "", "Argument[0]", "sql-injection", "manual"]
      - ["System.Data.Odbc", "OdbcDataAdapter", False, "OdbcDataAdapter", "(System.String,System.String)", "", "Argument[0]", "sql-injection", "manual"]
      - ["MySql.Data.MySqlClient", "MySqlDataAdapter", False, "MySqlDataAdapter", "(System.String,MySql.Data.MySqlClient.MySqlConnection)", "", "Argument[0]", "sql-injection", "manual"]
      - ["MySql.Data.MySqlClient", "MySqlDataAdapter", False, "MySqlDataAdapter", "(System.String,System.String)", "", "Argument[0]", "sql-injection", "manual"]
