# log4net `ILog` logging methods. `codeql/csharp-all` only treats calls on types
# deriving from an interface named `ILogger` as log message sinks, and
# `log4net.ILog` (which derives from `log4net.Core.ILoggerWrapper`) is not one.
# For the `params object[]` overloads only the format string is modeled:
# `cs/log-forging` sinks must be expressions, so the elements of the implicit
# `params` array cannot be expressed as sink inputs.
extensions:
  - addsTo:
      pack: codeql/csharp-all
      extensible: sinkModel
    data:
      - ["log4net", "ILog", True, "Debug", "(System.Object)", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Debug", "(System.Object,System.Exception)", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "DebugFormat", "(System.String,System.Object)", "", "Argument[0..1]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "DebugFormat", "(System.String,System.Object,System.Object)", "", "Argument[0..2]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "DebugFormat", "(System.String,System.Object,System.Object,System.Object)", "", "Argument[0..3]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "DebugFormat", "(System.String,System.Object[])", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "DebugFormat", "(System.IFormatProvider,System.String,System.Object[])", "", "Argument[1]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Info", "(System.Object)", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Info", "(System.Object,System.Exception)", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "InfoFormat", "(System.String,System.Object)", "", "Argument[0..1]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "InfoFormat", "(System.String,System.Object,System.Object)", "", "Argument[0..2]", "log-injection", "manual"]
