      - ["log4net", "ILog", True, "InfoFormat", "(System.IFormatProvider,System.String,System.Object[])", "", "Argument[1]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Warn", "(System.Object)", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Warn", "(System.Object,System.Exception)", "", "Argument[0]", "log-injection", "manual"]
