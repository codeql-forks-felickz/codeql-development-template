      - ["log4net", "ILog", True, "WarnFormat", "(System.IFormatProvider,System.String,System.Object[])", "", "Argument[1]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Error", "(System.Object)", "", "Argument[0]", "log-injection", "manual"]
      - ["log4net", "ILog", True, "Error", "(System.Object,System.Exception)", "", "Argument[0]", "log-injection", "manual"]
