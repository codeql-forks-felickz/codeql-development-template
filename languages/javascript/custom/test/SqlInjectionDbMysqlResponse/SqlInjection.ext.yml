extensions:
  # The JavaScript pack disables the `response` threat model by default
  # (codeql/javascript-all ext/default-threat-models-fixup.model.yml), so HTTP
  # client response data is only a source when `response` is enabled.
  - addsTo:
      pack: codeql/threat-models
      extensible: threatModelConfiguration
    data:
      - ["response", true, 0]
