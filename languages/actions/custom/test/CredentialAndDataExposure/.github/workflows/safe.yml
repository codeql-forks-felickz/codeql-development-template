name: Safe

on:
  push:

jobs:
  safe:
    runs-on: ubuntu-latest
    steps:
      - name: Decode a certificate into a file
        env:
          CERT_B64: ${{ secrets.CERT_B64 }}
        run: echo "$CERT_B64" | base64 --decode > cert.p12

      - name: Encoded value captured and masked
        env:
          SUPER_SECRET: ${{ secrets.DVWA_SECRET_KEY }}
        run: |
          ENCODED=$(echo "$SUPER_SECRET" | base64 -w0)
          echo "::add-mask::$ENCODED"
          echo "::add-mask::$(echo "$SUPER_SECRET" | base64 -w0)"
          OTHER=`echo "$SUPER_SECRET" | base32`
          echo "$SUPER_SECRET" | base64 >> "$GITHUB_OUTPUT"
          echo "$SUPER_SECRET" | base64 -w0 | docker login -u user --password-stdin

      - name: Non-secret values
        env:
          PUBLIC_VALUE: ${{ vars.PUBLIC_VALUE }}
        run: |
          echo "$PUBLIC_VALUE" | base64
          echo "${{ github.sha }}" | base64
          echo "${{ github.repository }}" | rev

      - name: Secret unrelated to the encoding
        env:
          SUPER_SECRET: ${{ secrets.DVWA_SECRET_KEY }}
        run: |
          curl -H "Authorization: $SUPER_SECRET" https://example.com
          echo "hello" | base64

      - name: PowerShell is out of scope
        shell: pwsh
        env:
          SUPER_SECRET: ${{ secrets.DVWA_SECRET_KEY }}
        run: echo "$env:SUPER_SECRET"
