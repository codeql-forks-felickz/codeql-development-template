# LDAP injection (CWE-90) sinks for the Win32 LDAP API (Wldap32 / winldap.h) and
# the OpenLDAP C API (ldap.h). All modeled search functions share the layout
# (ld, base, scope, filter, ...): `Argument[*1]` is the base distinguished name and
# `Argument[*3]` is the search filter.
extensions:
  - addsTo:
      pack: codeql/cpp-all
      extensible: sinkModel
    data:
      - ["", "", False, "ldap_search", "", "", "Argument[*1]", "ldap-injection", "manual"]
      - ["", "", False, "ldap_search", "", "", "Argument[*3]", "ldap-injection", "manual"]
      - ["", "", False, "ldap_searchA", "", "", "Argument[*1]", "ldap-injection", "manual"]
      - ["", "", False, "ldap_searchA", "", "", "Argument[*3]", "ldap-injection", "manual"]
      - ["", "", False, "ldap_searchW", "", "", "Argument[*1]", "ldap-injection", "manual"]
