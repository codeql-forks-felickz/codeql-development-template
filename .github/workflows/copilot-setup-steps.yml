name: "Copilot Setup Steps"

on:
  # Allow manual testing through the repository's "Actions" tab
  workflow_dispatch: {}
  # Automatically run the setup steps when an associated workflow is changed.
  push:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-codeql-environment/action.yml
      - qlt.conf.json
      - scripts/install-codeql-packs.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-codeql-environment/action.yml
      - qlt.conf.json
      - scripts/install-codeql-packs.sh

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Copilot Setup - Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Copilot Setup - Setup CodeQL environment
        uses: ./.github/actions/setup-codeql-environment

      - name: Copilot Setup - Install CodeQL workspace packs
        shell: bash
        run: ./scripts/install-codeql-packs.sh

      # The MCP server requires Node.js ^24.15.0 || >=26.0.0 (and npm >=11.6.2).
      - name: Copilot Setup - Setup Node.js for CodeQL MCP server
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "26"

      - name: Copilot Setup - Install CodeQL MCP server and tool-pack dependencies
        shell: bash
        run: |
          npm install --global codeql-development-mcp-server@2.27.1
          codeql-development-mcp-server-setup-packs

      - name: Copilot Setup - Verify CodeQL MCP server is available
        shell: bash
        run: |
          codeql version
          command -v codeql-development-mcp-server
